      - "${SOUNDFONT_HOST_DIR:-./soundfonts}:/soundfonts"
      - "${MIDI_RESOURCES_HOST_DIR:-../../abc2book_midi_resources}:/midi-resources:ro"
      # Mount repo outside /app so uvicorn --reload does not scan node_modules.
      - ../:/static/www:ro
      - snapcast_run:/run/snapcast
      - ./snapcast_config.py:/app/snapcast_config.py
      - ./snapcast_playback.py:/app/snapcast_playback.py
      - ./snapcast_routes.py:/app/snapcast_routes.py
      - ./cast_config.py:/app/cast_config.py
      - ./request_public_url.py:/app/request_public_url.py
      - ./cast_transcode_session.py:/app/cast_transcode_session.py
      - ./cast_playback.py:/app/cast_playback.py
      - ./cast_routes.py:/app/cast_routes.py
      - ./remote_playback_resolve.py:/app/remote_playback_resolve.py
      - ./remote_playback_render.py:/app/remote_playback_render.py
      - ./scripts/snapcast_tunebook_plugin.py:/app/scripts/snapcast_tunebook_plugin.py
    environment:
      REQUIRE_AUTH: "true"
      RESOLVER_DOMAIN: ${RESOLVER_DOMAIN:-peppertrees.syntithenai.com}
      CAST_PUBLIC_URL: ${CAST_PUBLIC_URL:-https://peppertrees.syntithenai.com}
      STATIC_SITE_DIR: /static/www
      ABC2BOOK_ROOT: /static/www
      SOUNDFONT_DIR: /soundfonts
      MIDI_RESOURCES_DIR: /midi-resources
      SOUNDFONT_DOWNLOAD_ENABLED: "${SOUNDFONT_DOWNLOAD_ENABLED:-true}"
    command:
      - python3
      - -m
      - uvicorn
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --reload
      - --reload-dir
      - /app
      - --reload-exclude
      - '**/__pycache__/**'
      - --reload-exclude
      - '**/*.log'

  score-convert:
    build:
      context: .
      dockerfile: Dockerfile.score-convert
    ports:
      - "8790:8790"
    environment:
      SCORE_CONVERT_SECRET: ${SCORE_CONVERT_SECRET:-dev-score-convert-secret}
      PORT: "8790"
    profiles:
      - score-convert
