# Development override: bind-mount the resolver source into the running
# container and enable uvicorn auto-reload so code changes take effect without
# rebuilding the image.
#
# Usage:
#   cd local-resolver
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Editing any of the mounted .py files restarts the server automatically. The
# base image is still used for the system deps, venvs (/opt/...), whisper build
# (/app/build) and models; only the Python source is overlaid from the host.
services:
  local-resolver:
    volumes:
      - ./server.py:/app/server.py
      - ./subprocess_utils.py:/app/subprocess_utils.py
      - ./soundfont_download.py:/app/soundfont_download.py
      - ./recording_artists.py:/app/recording_artists.py
      - ./background_markdown_links.py:/app/background_markdown_links.py
      - ./polite_fetch.py:/app/polite_fetch.py
      - ./browser_fetch.py:/app/browser_fetch.py
      - ./page_title_meta.py:/app/page_title_meta.py
      - ./chords_fetch.py:/app/chords_fetch.py
      - ./notation_fetch.py:/app/notation_fetch.py
      - ./archive_source_config.py:/app/archive_source_config.py
      - ./mediawiki_fetch.py:/app/mediawiki_fetch.py
      - ./cpdl_fetch.py:/app/cpdl_fetch.py
      - ./imslp_fetch.py:/app/imslp_fetch.py
      - ./josquin_fetch.py:/app/josquin_fetch.py
      - ./musicalion_fetch.py:/app/musicalion_fetch.py
      - ./openscore_fetch.py:/app/openscore_fetch.py
      - ./w3c_musicxml_fetch.py:/app/w3c_musicxml_fetch.py
      - ./score_attachment_fetch.py:/app/score_attachment_fetch.py
      - ./lyrics_fetch.py:/app/lyrics_fetch.py
      - ./lyrics_word_tools.py:/app/lyrics_word_tools.py
      - ./composer_discovery.py:/app/composer_discovery.py
      - ./genre_discovery.py:/app/genre_discovery.py
      - ./feed_generation.py:/app/feed_generation.py
      - ./feed_source_scrape.py:/app/feed_source_scrape.py
      - ./llm_runtime.py:/app/llm_runtime.py
      - ./analyze_practice.py:/app/analyze_practice.py
      - ./bulk_list_format.py:/app/bulk_list_format.py
      - ./tune_background_research.py:/app/tune_background_research.py
      - ./voice_command.py:/app/voice_command.py
      - ./playback_region_detect.py:/app/playback_region_detect.py
      - ./detect_chords.py:/app/detect_chords.py
      - ./madmom_chords.py:/app/madmom_chords.py
      - ./btc_chords:/app/btc_chords
      - ./detect_melody.py:/app/detect_melody.py
      - ./detect_timing.py:/app/detect_timing.py
      - ./chord_processing.py:/app/chord_processing.py
      - ./melody_pitch_processing.py:/app/melody_pitch_processing.py
      - ./audio_analysis_filters.py:/app/audio_analysis_filters.py
      - ./stem_separation.py:/app/stem_separation.py
      - ./separate_stems.py:/app/separate_stems.py
      - ./eval_transcription.py:/app/eval_transcription.py
      - ./scripts/eval_chords.py:/app/scripts/eval_chords.py
      - ./image_search.py:/app/image_search.py
      - ./sheet_image_features.py:/app/sheet_image_features.py
      - ./sheet_image_transcribe.py:/app/sheet_image_transcribe.py
      - ./sheet_image_metadata.py:/app/sheet_image_metadata.py
      - ./provider_cloud.py:/app/provider_cloud.py
      - ./midi_resources.py:/app/midi_resources.py
      - ./midi_fetch.py:/app/midi_fetch.py
      - ./midi_convert.py:/app/midi_convert.py
      - ./midi_analysis.py:/app/midi_analysis.py
      - ./midi_chord_infer.py:/app/midi_chord_infer.py
      - ./midi_harmony_voice.py:/app/midi_harmony_voice.py
      - ./midi_import_orchestrator.py:/app/midi_import_orchestrator.py
      - ./midi_import_score.py:/app/midi_import_score.py
      - ./midi_note_events.py:/app/midi_note_events.py
      - ./midi_to_abc.py:/app/midi_to_abc.py
      - ./midi_cleanup.py:/app/midi_cleanup.py
      - ./midi_drum_map.py:/app/midi_drum_map.py
      - ./musescore_fetch.py:/app/musescore_fetch.py
      - ./notation_title_variants.py:/app/notation_title_variants.py
      - "${SOUNDFONT_HOST_DIR:-./soundfonts}:/soundfonts"
      - "${MIDI_RESOURCES_HOST_DIR:-../../abc2book_midi_resources}:/midi-resources:ro"
      - ../:/app/www:ro
    environment:
      REQUIRE_AUTH: "true"
      STATIC_SITE_DIR: /app/www
      SOUNDFONT_DIR: /soundfonts
      MIDI_RESOURCES_DIR: /midi-resources
      SOUNDFONT_DOWNLOAD_ENABLED: "${SOUNDFONT_DOWNLOAD_ENABLED:-true}"
    command:
      - python3
      - -m
      - uvicorn
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --reload
      - --reload-dir
      - /app
