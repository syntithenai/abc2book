# Non-secret env for tunebook-resolver-light (Cloud Run).
# Copy to cloud-run-env.yaml and edit. Stripe keys go in Secret Manager (see setup-cloud-billing-secrets.sh).
REQUIRE_AUTH: "true"
RESOLVER_LIGHT_MODE: "true"
PROXY_ENABLED: "true"
YTDLP_REQUIRE_USER_PROXY: "true"
WHISPER_ENABLED: "true"
LLM_ENABLED: "true"
ALLOWED_ADMIN_EMAILS: "syntithenai@gmail.com"
ADMIN_CONTACT_EMAIL: "syntithenai@gmail.com"
ALLOWED_ORIGINS: "https://tunebook.net,https://www.tunebook.net,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,https://localhost,http://localhost,ionic://localhost"
PROVIDER_WHISPER_PROVIDER: "groq"
PROVIDER_WHISPER_BASE_URL: "https://api.groq.com/openai/v1"
PROVIDER_WHISPER_MODEL: "whisper-large-v3"
PROVIDER_LLM_PROVIDER: "groq"
PROVIDER_LLM_BASE_URL: "https://api.groq.com/openai/v1"
PROVIDER_LLM_MODEL: "openai/gpt-oss-120b"
PROVIDER_OCR_PROVIDER: "groq"
PROVIDER_OCR_BASE_URL: "https://api.groq.com/openai/v1"
PROVIDER_OCR_MODEL: "meta-llama/llama-4-scout-17b-16e-instruct"
AUTH_SESSION_STORE: "firestore"
AUTH_SESSION_FIRESTORE_PROJECT: "abc2book"
AUTH_SESSION_FIRESTORE_COLLECTION: "oauth_sessions"
AUTH_REFRESH_MIN_INTERVAL_SECONDS: "45"
AUTH_ACCESS_TOKEN_CACHE_SKEW_SECONDS: "60"
# Billing ledger (central — SPA routes /billing/* here)
BILLING_ENABLED: "true"
BILLING_STORE: "firestore"
BILLING_FIRESTORE_PROJECT: "abc2book"
BILLING_MARKUP: "2.0"
BILLING_TRIAL_CREDIT_CENTS: "30"
BILLING_CHECKOUT_SUCCESS_URL: "https://tunebook.net/#/billing/success?session_id={CHECKOUT_SESSION_ID}"
BILLING_CHECKOUT_CANCEL_URL: "https://tunebook.net/#/billing/cancel"
BILLING_CHECKOUT_ALLOWED_RETURN_ORIGINS: "https://tunebook.net,https://www.tunebook.net,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
# Score-convert sidecar (internal MuseScore conversions). Set URL after deploy-cloud-score-convert.sh.
SCORE_CONVERT_URL: "https://tunebook-score-convert-927667106833.australia-southeast1.run.app"
SCORE_CONVERT_USE_ID_TOKEN: "true"