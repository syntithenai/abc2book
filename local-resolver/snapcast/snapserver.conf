# Snapserver configuration for Tune Book resolver sidecar.
# Mounted into the snapserver container by docker compose profile `snapcast`.

[logging]
logfilter = *:info,State:warn

[http]
enabled = true
port = 1780
doc_root = /usr/share/snapserver/web

[stream]
source = tcp://local-resolver:4954?name=TuneBook&mode=client&sampleformat=48000:16:2&controlscript=/snapcast/tunebook_snapcast_plugin.py

[streaming_client]
buffer_ms = 1000

[tcp]
enabled = true
port = 1704

[jsonrpc]
enabled = true
