# Snapserver configuration for Tune Book resolver sidecar.
# Mounted into the snapserver container by docker compose profile `snapcast`.

[server]
mdns_enabled = false

[logging]
logfilter = *:info,State:warn

[http]
enabled = true
port = 1780
doc_root = /usr/share/snapserver/snapweb

[stream]
plugin_dir = /snapcast
sampleformat = 48000:16:2
default_source = TuneBook
# Snapserver listens; resolver connects (snapcast 0.35 TCP client mode rejects hostnames).
source = tcp://0.0.0.0:4954?name=TuneBook&mode=server&controlscript=tunebook_snapcast_plugin.py

[streaming_client]
buffer_ms = 1000

[tcp-streaming]
enabled = true
port = 1704

[tcp-control]
enabled = true
port = 1705

[jsonrpc]
enabled = true
