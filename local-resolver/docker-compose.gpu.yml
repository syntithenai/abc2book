# Optional GPU-enabled resolver (requires NVIDIA Container Toolkit).
# Usage:
#   docker compose --profile gpu up --build
#
# For CUDA PyTorch inside the image, rebuild with:
#   MELODY_TORCH_INDEX=https://download.pytorch.org/whl/cu121 docker compose --profile gpu build

services:
  local-resolver-gpu:
    build:
      context: .
      args:
        MELODY_TORCH_INDEX: ${MELODY_TORCH_INDEX:-https://download.pytorch.org/whl/cu121}
        MELODY_PREFETCH_DEVICE: cuda
    container_name: abc2book-local-resolver-gpu
    profiles: ["gpu"]
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      YTDLP_COOKIES_PATH: /app/secrets/youtube-cookies.txt
      MAX_STREAM_BYTES: "83886080"
      MODEL_PATH: /models/ggml-large-v3.bin
      WHISPER_CPP_PATH: /app/build/bin/whisper-cli
      WHISPER_BACKEND_PREFERENCE: auto
      WHISPER_CPU_FALLBACK: "true"
      MELODY_BACKEND_PREFERENCE: gpu
      MELODY_SOURCE_SEPARATION: auto
      NVIDIA_VISIBLE_DEVICES: all
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./secrets:/app/secrets:ro
      - "/home/stever/projects/whisper models:/models:ro"
    restart: unless-stopped
