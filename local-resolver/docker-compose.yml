services:
  local-resolver:
    build: .
    container_name: abc2book-local-resolver
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      # Auth settings (REQUIRE_AUTH, GOOGLE_CLIENT_ID, ALLOWED_EMAILS, ALLOWED_ORIGINS)
      # come from .env via env_file above. Do NOT hardcode REQUIRE_AUTH here, because
      # values in this environment block override env_file and would disable auth.
      YTDLP_COOKIES_PATH: /app/secrets/youtube-cookies.txt
      MAX_STREAM_BYTES: "83886080"
      MODEL_PATH: /models/ggml-large-v3.bin
      WHISPER_CPP_PATH: /app/build/bin/whisper-cli
      WHISPER_BACKEND_PREFERENCE: auto
      WHISPER_CPU_FALLBACK: "true"
      # Melody: auto tries CUDA when available inside the container
      MELODY_BACKEND_PREFERENCE: ${MELODY_BACKEND_PREFERENCE:-auto}
      MELODY_SOURCE_SEPARATION: ${MELODY_SOURCE_SEPARATION:-auto}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./secrets:/app/secrets:ro
      - "/home/stever/projects/whisper models:/models:ro"
    restart: unless-stopped

  # Optional HTTPS reverse proxy. Enable with:
  #   docker compose --profile https up --build
  # Requires RESOLVER_DOMAIN (and optionally ACME_EMAIL) in .env, public DNS
  # pointing at this machine, and ports 80/443 reachable from the internet
  # for automatic public certificates.
  caddy:
    image: caddy:2
    container_name: abc2book-resolver-caddy
    profiles: ["https"]
    depends_on:
      - local-resolver
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      RESOLVER_DOMAIN: ${RESOLVER_DOMAIN:-peppertrees.syntithenai.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional Namecheap dynamic DNS updater. Enable with:
  #   docker compose --profile ddns up -d
  # (combine with the proxy, e.g. docker compose --profile https --profile ddns up -d)
  # Keeps NAMECHEAP_DDNS_HOSTS under NAMECHEAP_DDNS_DOMAIN pointed at this
  # machine's public IPv4. Requires Dynamic DNS enabled on the domain in the
  # Namecheap dashboard and the Dynamic DNS password set in .env.
  ddns:
    image: curlimages/curl:8.11.1
    container_name: abc2book-resolver-ddns
    profiles: ["ddns"]
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/usr/local/bin/ddns-namecheap.sh"]
    volumes:
      - ./ddns-namecheap.sh:/usr/local/bin/ddns-namecheap.sh:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
