services:
  # Stable Audio 3 backing for practice-track generation (Vulkan). Requires a
  # host-built audio.cpp tree and model weights; see music_generation/README.md.
  # Optional: use profile `audio-cpp` when you want the in-compose sidecar.
  # If audio.cpp already runs on the host (AUDIO_CPP_URL=host.docker.internal:8788),
  # omit this profile to avoid port 8788 conflicts.
  audio-cpp:
    build: ./audio-cpp
    container_name: abc2book-audio-cpp
    profiles: ["audio-cpp"]
    ports:
      - "${AUDIO_CPP_PUBLISH_PORT:-8788}:8788"
    env_file:
      - .env
    environment:
      AUDIO_CPP_SERVER_BIN: /audio-cpp/build/linux-vulkan-release/bin/audiocpp_server
      AUDIO_CPP_CONFIG: /app/server.docker.json
      AUDIO_CPP_INPUT_DIR: /audio-cpp-incoming
    volumes:
      - "${AUDIO_CPP_HOST_DIR:-${HOME}/audio.cpp}:/audio-cpp:ro"
      - "${AUDIO_CPP_HOST_DIR:-${HOME}/audio.cpp}/incoming:/audio-cpp-incoming"
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "44"
      - "110"
    device_cgroup_rules:
      - "c 226:* rmw"
      - "c 511:* rmw"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:8788/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  local-resolver:
    build: .
    container_name: abc2book-local-resolver
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
      - ./data:/app/data
      - "${WHISPER_MODELS_DIR:-./whisper/models}:/models:ro"
      - "${SOUNDFONT_HOST_DIR:-./soundfonts}:/soundfonts"
      - "${MIDI_RESOURCES_HOST_DIR:-../../abc2book_midi_resources}:/midi-resources:ro"
      - "${MUSIC_COLLECTION_HOST_DIR:-./music-collection}:/music-collection:ro"
      - ../:/app/www:ro
      - "${AUDIO_CPP_HOST_DIR:-${HOME}/audio.cpp}/incoming:/audio-cpp-incoming"
      - snapcast_run:/run/snapcast
    environment:
      # In-compose sidecar; override in .env for a host-managed process instead.
      AUDIO_CPP_URL: ${AUDIO_CPP_URL:-http://audio-cpp:8788}
      AUDIO_CPP_INPUT_DIR: ${AUDIO_CPP_INPUT_DIR:-/audio-cpp-incoming}
      PORT: "8787"
      RESOLVER_DOMAIN: ${RESOLVER_DOMAIN:-peppertrees.syntithenai.com}
      CAST_PUBLIC_URL: ${CAST_PUBLIC_URL:-https://peppertrees.syntithenai.com}
      STATIC_SITE_DIR: /app/www
      SOUNDFONT_DIR: /soundfonts
      MIDI_RESOURCES_DIR: /midi-resources
      MUSIC_COLLECTION_DIR: /music-collection
      # Always use the in-container index mount; do not pass through host
      # MUSIC_COLLECTION_INDEX_DIR (CLI scripts on the host set that separately).
      MUSIC_COLLECTION_INDEX_DIR: /app/data/music-collection
      SOUNDFONT_DOWNLOAD_ENABLED: "${SOUNDFONT_DOWNLOAD_ENABLED:-true}"
      SNAPCAST_ENABLED: "${SNAPCAST_ENABLED:-false}"
      SNAPCAST_TCP_MODE: "${SNAPCAST_TCP_MODE:-client}"
      SNAPCAST_TCP_TARGET: "${SNAPCAST_TCP_TARGET:-snapserver:4954}"
      SNAPCAST_TCP_BIND: "${SNAPCAST_TCP_BIND:-0.0.0.0:4954}"
      SNAPCAST_SERVER_HOST: "${SNAPCAST_SERVER_HOST:-snapserver}"
      SNAPCAST_STREAM_NAME: "${SNAPCAST_STREAM_NAME:-TuneBook}"
      SNAPCAST_PLUGIN_URL: "${SNAPCAST_PLUGIN_URL:-http://local-resolver:8787/snapcast-playback/plugin}"
      # Auth settings (REQUIRE_AUTH, GOOGLE_CLIENT_ID, RESOLVER_ACCESS_EMAILS, ALLOWED_ORIGINS)
      # come from .env via env_file above. Do NOT hardcode REQUIRE_AUTH here, because
      # values in this environment block override env_file and would disable auth.
      YTDLP_COOKIES_PATH: /app/secrets/youtube-cookies.txt
      MAX_STREAM_BYTES: "83886080"
      MODEL_PATH: /models/ggml-large-v3.bin
      WHISPER_CPP_PATH: /app/build/bin/whisper-cli
      WHISPER_BACKEND_PREFERENCE: auto
      WHISPER_CPU_FALLBACK: "true"
      # Melody: auto tries CUDA when available inside the container
      MELODY_BACKEND_PREFERENCE: ${MELODY_BACKEND_PREFERENCE:-auto}
      MELODY_BACKEND: ${MELODY_BACKEND:-auto}
      MELODY_SOURCE_SEPARATION: ${MELODY_SOURCE_SEPARATION:-auto}
      VISION_VENV_PYTHON: /opt/vision-venv/bin/python
      VISION_CACHE_ROOT: /opt/vision-cache
      PADDLE_PDX_CACHE_HOME: /opt/vision-cache
      FLAGS_enable_pir_api: "0"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    devices:
      - /dev/dri:/dev/dri
    # Lets the container reach services on the host (e.g. an LM Studio LLM at
    # host.docker.internal:1234) on Linux, where this hostname is not provided
    # automatically as it is under Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      snapserver:
        condition: service_healthy
        required: false

  # OpenAI-compatible LLM (llama.cpp Vulkan) using the same GGUF LM Studio uses.
  # Set LLM_EXTERNAL_BASE_URL to skip model load and reverse-proxy an external
  # OpenAI-compatible service instead. RESEARCH_LLM_BASE_URL should point at the
  # gateway below (http://host.docker.internal:12340/v1).
  llm:
    build: ./llm
    container_name: abc2book-llm
    ports:
      - "${LLM_PUBLISH_PORT:-12341}:8080"
    env_file:
      - .env
    environment:
      LLM_EXTERNAL_BASE_URL: ${LLM_EXTERNAL_BASE_URL:-}
      LLM_EXTERNAL_API_KEY: ${LLM_EXTERNAL_API_KEY:-}
      LLM_MODEL_FILE: /models/${LLM_MODEL_FILENAME:-gemma-4-31B-it-QAT-Q4_0.gguf}
      LLM_MODEL_ALIAS: ${RESEARCH_LLM_MODEL:-google/gemma-4-31b-qat}
      LLM_API_KEY: ${RESEARCH_LLM_API_KEY:-lm-studio}
      LLM_CTX_SIZE: ${LLM_CTX_SIZE:-8192}
      LLM_N_GPU_LAYERS: ${LLM_N_GPU_LAYERS:-99}
      LLM_BATCH_SIZE: ${LLM_BATCH_SIZE:-512}
      LLM_UBATCH_SIZE: ${LLM_UBATCH_SIZE:-512}
      LLM_PARALLEL: ${LLM_PARALLEL:-1}
      LLM_MMPROJ_FILE: ${LLM_MMPROJ_FILE:-}
      LLM_SERVER_EXTRA_ARGS: ${LLM_SERVER_EXTRA_ARGS:-}
      LLM_WAIT_FOR_MODEL_SECONDS: ${LLM_WAIT_FOR_MODEL_SECONDS:-0}
      LLM_LOG_TRAFFIC: ${LLM_LOG_TRAFFIC:-true}
      LLM_LOG_VERBOSE: ${LLM_LOG_VERBOSE:-true}
      LLM_LOG_BODY_CHARS: ${LLM_LOG_BODY_CHARS:-50000}
      LLM_LOG_PROMPTS_DIR: ${LLM_LOG_PROMPTS_DIR:-/var/log/llama-prompts}
      LLM_REASONING_FORMAT: ${LLM_REASONING_FORMAT:-deepseek}
      LLM_LOG_LEVEL: ${LLM_LOG_LEVEL:-info}
      LLM_LISTEN_HOST: 0.0.0.0
      LLM_LISTEN_PORT: "8080"
    volumes:
      # Directory mount so external-proxy mode still starts without a GGUF bind.
      - "${LLM_MODELS_DIR:-${HOME}/.lmstudio/models/lmstudio-community/gemma-4-31B-it-QAT-GGUF}:/models:ro"
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      # Host GIDs for /dev/dri and /dev/kfd (video=44, render=110 on Debian/Ubuntu).
      - "44"
      - "110"
    # AMD Strix Halo / discrete GPUs via Vulkan. Harmless when absent.
    device_cgroup_rules:
      - "c 226:* rmw"
      - "c 511:* rmw"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:8080/health || curl -fsS --max-time 5 http://127.0.0.1:8080/v1/models || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # Prefer the in-compose llm service; fall back to host LM Studio (:1234).
  # Replaces the old socat llm-bridge. Keep listening on :12340 so existing
  # RESEARCH_LLM_BASE_URL=http://host.docker.internal:12340/v1 keeps working.
  llm-gateway:
    build: ./llm
    container_name: abc2book-llm-bridge
    network_mode: host
    entrypoint: ["python3", "/app/gateway.py"]
    environment:
      LLM_GATEWAY_LISTEN_HOST: 0.0.0.0
      LLM_GATEWAY_LISTEN_PORT: "12340"
      LLM_PRIMARY_BASE_URL: http://127.0.0.1:${LLM_PUBLISH_PORT:-12341}
      LLM_FALLBACK_BASE_URL: http://127.0.0.1:${LLM_FALLBACK_PORT:-1234}
      LLM_EXTERNAL_BASE_URL: ""
      LLM_GATEWAY_HEALTH_TTL_SECONDS: ${LLM_GATEWAY_HEALTH_TTL_SECONDS:-15}
      LLM_LOG_LEVEL: ${LLM_LOG_LEVEL:-info}
    depends_on:
      - llm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:12340/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Text-to-speech stack (profile `tts` = gateway). Backends:
  #   profile `tts-gpu` — Kokoro (AMD ROCm or Strix Halo CPU image via tts-up.sh)
  #   profile `tts-cpu` — Piper fallback (only when Kokoro is not used)
  #   ./scripts/tts-up.sh
  tts-cpu:
    build:
      context: ./tts
      dockerfile: Dockerfile
    container_name: abc2book-tts-cpu
    profiles: ["tts-cpu"]
    environment:
      TTS_PIPER_VOICE: ${TTS_PIPER_VOICE:-en_US-lessac-medium}
      TTS_PIPER_DATA_DIR: /voices
      TTS_LISTEN_HOST: 0.0.0.0
      TTS_LISTEN_PORT: "5000"
    volumes:
      - tts_piper_voices:/voices
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:5000/info || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Kokoro runs as appuser (uid 1000). Named volumes are root-owned on first
  # create, which breaks uv cache init and leaves tts-gpu in a restart loop.
  tts-gpu-init:
    image: alpine:3.21
    container_name: abc2book-tts-gpu-init
    profiles: ["tts-gpu"]
    volumes:
      - tts_kokoro_config:/config
      - tts_kokoro_cache:/cache
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "chown -R ${TTS_KOKORO_UID:-1000}:${TTS_KOKORO_GID:-1000} /config /cache",
      ]
    restart: "no"

  tts-gpu:
    # Kokoro primary backend (OpenAI-compatible :8880). Default ROCm image; on Strix Halo
    # (gfx1151) tts-up.sh auto-selects the CPU image — ROCm 6.4 segfaults on gfx1151.
    image: ${TTS_KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-rocm:latest}
    container_name: abc2book-tts-gpu
    profiles: ["tts-gpu"]
    depends_on:
      tts-gpu-init:
        condition: service_completed_successfully
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
    environment:
      USE_GPU: ${TTS_KOKORO_USE_GPU:-true}
      DEVICE: ${TTS_KOKORO_DEVICE:-gpu}
      DOWNLOAD_MODEL: "true"
      MIOPEN_FIND_MODE: "2"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
      HSA_ENABLE_SDMA: ${HSA_ENABLE_SDMA:-}
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "44"
      - "110"
    device_cgroup_rules:
      - "c 226:* rmw"
      - "c 511:* rmw"
    volumes:
      - tts_kokoro_config:/home/appuser/.config
      - tts_kokoro_cache:/home/appuser/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:8880/health || curl -fsS --max-time 5 http://127.0.0.1:8880/v1/models || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 600s
    restart: unless-stopped

  tts-gateway:
    build:
      context: ./tts
      dockerfile: Dockerfile.gateway
    container_name: abc2book-tts-gateway
    profiles: ["tts"]
    ports:
      - "${TTS_PUBLISH_PORT:-8789}:8789"
    environment:
      TTS_GATEWAY_LISTEN_HOST: 0.0.0.0
      TTS_GATEWAY_LISTEN_PORT: "8789"
      TTS_PRIMARY_URL: http://tts-gpu:8880
      TTS_FALLBACK_URL: http://tts-cpu:5000
      TTS_PRIMARY_KIND: openai
      TTS_FALLBACK_KIND: piper
      TTS_PRIMARY_PROBE_PATH: /health
      TTS_FALLBACK_PROBE_PATH: /info
      TTS_GATEWAY_HEALTH_TTL_SECONDS: ${TTS_GATEWAY_HEALTH_TTL_SECONDS:-15}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:8789/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Optional HTTPS reverse proxy. Enable with:
  #   docker compose --profile https up --build
  # Requires RESOLVER_DOMAIN (and optionally ACME_EMAIL) in .env, public DNS
  # pointing at this machine, and ports 80/443 reachable from the internet
  # for automatic public certificates.
  caddy:
    image: caddy:2
    container_name: abc2book-resolver-caddy
    profiles: ["https"]
    depends_on:
      - local-resolver
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      RESOLVER_DOMAIN: ${RESOLVER_DOMAIN:-peppertrees.syntithenai.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional Namecheap dynamic DNS updater. Enable with:
  #   docker compose --profile ddns up -d
  # (combine with the proxy, e.g. docker compose --profile https --profile ddns up -d)
  # Keeps NAMECHEAP_DDNS_HOSTS under NAMECHEAP_DDNS_DOMAIN pointed at this
  # machine's public IPv4. Requires Dynamic DNS enabled on the domain in the
  # Namecheap dashboard and the Dynamic DNS password set in .env.
  ddns:
    image: curlimages/curl:8.11.1
    container_name: abc2book-resolver-ddns
    profiles: ["ddns"]
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/usr/local/bin/ddns-namecheap.sh"]
    volumes:
      - ./ddns-namecheap.sh:/usr/local/bin/ddns-namecheap.sh:ro
    restart: unless-stopped

  snapserver:
    build:
      context: ./snapcast
      dockerfile: Dockerfile.snapserver
    image: abc2book-snapserver:local
    container_name: abc2book-snapserver
    profiles: ["snapcast"]
    ports:
      - "${SNAPCAST_PUBLISH_PORT:-1780}:1780"
      - "${SNAPCAST_CLIENT_PORT:-1704}:1704"
      - "${SNAPCAST_CLIENT_PORT_TLS:-1705}:1705"
    volumes:
      - ./snapcast/snapserver.conf:/etc/snapserver.conf:ro
      - ./scripts/snapcast_tunebook_plugin.py:/snapcast/tunebook_snapcast_plugin.py:ro
      - snapcast_run:/run/snapcast
    environment:
      SNAPCAST_PLUGIN_URL: http://local-resolver:8787/snapcast-playback/plugin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:1780/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Plays Snapcast audio on the resolver machine's speakers (ALSA via /dev/snd).
  # Disable on headless hosts with SNAPCLIENT_ENABLED=false in .env.
  snapclient:
    build:
      context: ./snapcast
      dockerfile: Dockerfile.snapclient
    container_name: abc2book-snapclient
    profiles: ["snapcast"]
    depends_on:
      snapserver:
        condition: service_healthy
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      SNAPCLIENT_ENABLED: "${SNAPCLIENT_ENABLED:-true}"
      SNAPSERVER_HOST: "${SNAPCAST_SERVER_HOST:-snapserver}"
      SNAPSERVER_PORT: "${SNAPCAST_CLIENT_PORT:-1704}"
      SNAPCLIENT_HOSTNAME: "${SNAPCLIENT_HOSTNAME:-resolver-host}"
      SNAPCLIENT_SOUNDCARD: "${SNAPCLIENT_SOUNDCARD:-default}"
    restart: unless-stopped

  # Stripe PayPal Custom Payment Method adapter (after Stripe approval).
  # See PAYPAL_CPM.md. Replace image/ports with Stripe's deployment guide.
  #   docker compose --profile paypal-cpm up -d
  paypal-cpm:
    image: "${PAYPAL_CPM_IMAGE:-stripe/paypal-cpm-adapter:latest}"
    container_name: abc2book-paypal-cpm
    profiles: ["paypal-cpm"]
    env_file:
      - .env
    environment:
      PAYPAL_CPM_LISTEN_PORT: "${PAYPAL_CPM_LISTEN_PORT:-8080}"
    ports:
      - "${PAYPAL_CPM_PUBLISH_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tts_kokoro_config:
  tts_kokoro_cache:
  tts_miopen_config:
  tts_miopen_cache:
  tts_piper_voices:
  snapcast_run:
