services:
  local-resolver:
    build: .
    container_name: abc2book-local-resolver
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      YTDLP_COOKIES_PATH: /app/secrets/youtube-cookies.txt
      MAX_STREAM_BYTES: "83886080"
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
