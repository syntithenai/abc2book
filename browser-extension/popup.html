<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TuneBook Helper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        min-width: 260px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        line-height: 1.4;
        margin: 0 0 8px;
      }
      code {
        font-size: 11px;
      }
      .ok {
        color: #0a7a32;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>TuneBook Helper</h1>
    <p class="ok">Extension active</p>
    <p>
      Open <strong>tunebook.net</strong> or local Tunebook, then <strong>reload the tab</strong>.
      Settings → Media should show <em>TuneBook Helper: connected</em>.
    </p>
    <p>Version <code id="ver">…</code></p>
    <script src="popup.js"></script>
  </body>
</html>
