// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Avoid stale root-owned build/ dirs under node_modules (from prior sudo/docker builds).
subprojects { subproject ->
    def projectPath = subproject.projectDir.absolutePath
    if (projectPath.contains('@capacitor')) {
        def suffix = projectPath.substring(projectPath.indexOf('@capacitor') + '@capacitor'.length() + 1)
        def slug = suffix.replace(File.separator, '_')
        subproject.buildDir = new File(rootProject.projectDir.parentFile, ".android-capacitor-build/${slug}")
    } else if (subproject.name == 'capacitor-cordova-android-plugins') {
        subproject.buildDir = new File(rootProject.projectDir.parentFile, '.android-capacitor-build/cordova-plugins')
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
