    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <script async defer src="%PUBLIC_URL%/lame.min.js"></script>
    <script async defer src="%PUBLIC_URL%/qrcode.js"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client" ></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8152690534650306"
     crossorigin="anonymous"></script>

    <title>Tune Book</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function() {
        var ATTEMPT_KEY = 'bookstorage_fresh_load_attempt';
        var ABORTED_KEY = 'bookstorage_fresh_load_aborted';
        var PREFER_KEY = 'bookstorage_prefer_fresh_app';
        var PENDING_CLEAR_KEY = 'bookstorage_fresh_pending_cache_clear';
        var REVERT_HASH = '#/tunes';
        var WATCHDOG_MS = 20000;

        function hasFreshParam() {
          try {
            if (new URLSearchParams(window.location.search).get('fresh') === '1') return true;
            var hash = window.location.hash || '';
            var qIndex = hash.indexOf('?');
            if (qIndex < 0) return false;
            return new URLSearchParams(hash.slice(qIndex + 1)).get('fresh') === '1';
          } catch (e) {
            return false;
          }
        }

        function isImportRoute() {
          var hash = window.location.hash || '';
          return hash.indexOf('#/importdoc') === 0;
        }

        function revertUrl() {
          return (window.location.pathname || '/') + REVERT_HASH;
        }

        function clearFreshState() {
          try {
            localStorage.removeItem(PREFER_KEY);
            localStorage.removeItem(PENDING_CLEAR_KEY);
            sessionStorage.removeItem(ATTEMPT_KEY);
          } catch (e) {}
        }

        function revertToCachedApp() {
          clearFreshState();
          try { sessionStorage.setItem(ABORTED_KEY, '1'); } catch (e) {}
          window.location.replace(isImportRoute() ? revertUrl() : (window.location.pathname || '/'));
        }

        if (!hasFreshParam()) return;

        if (!navigator.onLine) {
          revertToCachedApp();
          return;
        }

        try { sessionStorage.setItem(ATTEMPT_KEY, '1'); } catch (e) {}

        window.setTimeout(function() {
          try {
            if (sessionStorage.getItem(ATTEMPT_KEY) !== '1') return;
          } catch (e) {
            return;
          }
          var root = document.getElementById('root');
          if (root && root.childNodes && root.childNodes.length > 0) return;
          revertToCachedApp();
        }, WATCHDOG_MS);

        window.addEventListener('error', function(event) {
          try {
            if (sessionStorage.getItem(ATTEMPT_KEY) !== '1') return;
          } catch (e) {
            return;
          }
          var src = event && (event.filename || (event.target && event.target.src));
          if (src && String(src).indexOf('/static/') >= 0) {
            revertToCachedApp();
          }
        }, true);
      })();
    </script>
    <div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.

  </body>
